# Run without MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data is kept in memory and reset on every restart.
spring.datasource.url=jdbc:h2:mem:tricity;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
