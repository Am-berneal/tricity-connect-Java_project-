# ============================================================
#  TriCity Connect - main settings (MySQL)
#  1. Create the database once:   CREATE DATABASE tricity_connect;
#  2. Change the username/password below to your MySQL login.
#  3. Run:  mvn spring-boot:run      then open http://localhost:8080
#  No MySQL?  Run with the built-in H2 database instead:
#            mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================
spring.application.name=tricity-connect
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tricity_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created/updated automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Fills the database with Tricity stops, routes, buses, trips and demo users on first start
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Language files (English, Hindi, Punjabi)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.format.date=iso
